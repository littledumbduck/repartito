name: Release

# Al publicar una etiqueta (git tag v0.1.0 && git push --tags) construye el instalador de Windows
# y lo adjunta a una release de GitHub, de donde lo descarga la gente.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icons
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        with:
          # latest.yml y .blockmap los usa la app instalada para detectar y descargar actualizaciones
          files: |
            dist/Repartito-Instalador-*.exe
            dist/Repartito-Instalador-*.exe.blockmap
            dist/latest.yml
          generate_release_notes: true
